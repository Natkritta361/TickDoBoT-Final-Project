<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TickDoBot — Team Dashboard</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --primary: #10B981;
            --primary-light: #D1FAE5;
            --accent: #3B82F6;
            --accent-light: #DBEAFE;
            --border: #E2E8F0;
            --danger: #EF4444;
            --danger-bg: #FEE2E2;
            --warning: #F59E0B;
            --dark-bg: #1E293B;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            padding: 24px 20px;
            padding-bottom: 60px;
        }

        /* Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }
        .header-content { flex: 1; }
        .badge-title {
            display: inline-block;
            background-color: var(--primary-light);
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-dark);
            margin-bottom: 4px;
        }
        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .btn-reload {
            background-color: #F1F5F9;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reload:active { transform: rotate(45deg); }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            background-color: #FFFFFF;
            color: var(--text-muted);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .tab.active {
            background-color: var(--accent-light);
            color: var(--accent);
            border-color: transparent;
        }

        /* Task Card */
        .task-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s;
        }
        .task-card:active { transform: scale(0.98); }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .badge-active {
            background: var(--accent-light);
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        .task-id {
            color: #CBD5E1;
            font-size: 12px;
            font-weight: 600;
        }
        .task-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .task-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Progress */
        .progress-section { margin-bottom: 20px; }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: #94A3B8;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .progress-bar-bg {
            height: 6px;
            background: #F1F5F9;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* Card Footer */
        .card-divider {
            height: 1px;
            background: repeating-linear-gradient(to right, transparent, transparent 4px, var(--border) 4px, var(--border) 8px);
            margin: 0 -20px 16px;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
        }
        .footer-item { display: flex; align-items: center; gap: 6px; }

        /* Assignees Section (Expanded View) */
        .assignees-container { margin-top: 24px; display: none; }
        .assignees-title {
            font-size: 11px;
            font-weight: 800;
            color: #94A3B8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .assignee-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg);
            border-radius: 16px;
            margin-bottom: 12px;
        }
        .assignee-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            background: #E2E8F0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #64748B;
            font-size: 14px;
        }
        .assignee-details { display: flex; flex-direction: column; }
        .assignee-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-dark);
        }
        .assignee-status {
            font-size: 11px;
            font-weight: 800;
            color: var(--warning);
            text-transform: uppercase;
        }
        .assignee-status.done { color: var(--primary); }
        
        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-submit.done {
            background: #E2E8F0;
            color: #94A3B8;
            cursor: not-allowed;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            display: none;
        }
        .btn-action {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-edit {
            background: var(--dark-bg);
            color: white;
        }
        .btn-delete {
            background: var(--danger-bg);
            color: var(--danger);
        }

        /* Loading */
        #loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        /* Utility */
        .expanded .assignees-container, .expanded .action-buttons { display: block; }
        .expanded .card-divider, .expanded .card-footer { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-content">
            <div class="badge-title">TEAM DASHBOARD</div>
            <h1>Workflows</h1>
            <p class="subtitle">Real-time team performance</p>
        </div>
        <button class="btn-reload" onclick="loadTasks()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.5l1.75 1.93"/></svg>
        </button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="setFilter('pending')" id="tab-pending">1 PENDING</div>
        <div class="tab" onclick="setFilter('completed')" id="tab-completed">0 COMPLETED</div>
    </div>

    <div id="loading">Loading workflows...</div>
    <div id="taskList"></div>

    <script>
        let currentGroupId = null;
        let allTasks = [];
        let currentFilter = 'pending';
        let currentUserId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            currentGroupId = params.get('groupId');
            
            try {
                await liff.init({ liffId: window.__LIFF_ID__ || '2009838530-I0nGl09H' });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentUserId = profile.userId;
                } else {
                    liff.login({ redirectUri: location.href });
                    return;
                }
            } catch (e) { console.warn('LIFF Init error', e); }

            if (currentGroupId) {
                loadTasks();
            } else {
                document.getElementById('loading').innerText = 'Please open this dashboard from your LINE group.';
            }
        });

        async function loadTasks() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('taskList').innerHTML = '';
            
            try {
                const res = await fetch(`/api/tasks/${currentGroupId}`);
                const data = await res.json();
                if (data.success) {
                    allTasks = data.tasks;
                    renderTasks();
                } else {
                    document.getElementById('loading').innerText = 'Failed to load tasks.';
                }
            } catch (err) {
                document.getElementById('loading').innerText = 'Error connection to server.';
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.getElementById('tab-pending').classList.toggle('active', filter === 'pending');
            document.getElementById('tab-completed').classList.toggle('active', filter === 'completed');
            renderTasks();
        }

        function renderTasks() {
            document.getElementById('loading').style.display = 'none';
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            let pendingCount = 0;
            let completedCount = 0;

            allTasks.forEach(task => {
                const isCompleted = task.status === 'done';
                if (isCompleted) completedCount++;
                else pendingCount++;

                if ((currentFilter === 'pending' && isCompleted) || (currentFilter === 'completed' && !isCompleted)) {
                    return;
                }

                // Calculate progress
                const assignments = task.assignments || [];
                const doneCount = assignments.filter(a => a.status === 'submitted').length;
                const totalCount = assignments.length;
                const progress = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
                
                // Format Date
                let dateStr = 'No deadline';
                if (task.deadline) {
                    const date = new Date(task.deadline._seconds ? task.deadline._seconds * 1000 : task.deadline);
                    dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                }

                const card = document.createElement('div');
                card.className = 'task-card';
                card.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') {
                        card.classList.toggle('expanded');
                    }
                };

                let assigneesHTML = '';
                assignments.forEach(a => {
                    const isDone = a.status === 'submitted';
                    const displayName = task.memberMap[a.lineUserId] || a.lineUserId.substring(0, 5);
                    const initial = displayName.charAt(0).toUpperCase();

                    // Format submission time
                    let submittedTimeStr = '';
                    if (isDone && a.submittedAt) {
                        const submittedMs = a.submittedAt._seconds
                            ? a.submittedAt._seconds * 1000
                            : new Date(a.submittedAt).getTime();
                        const submittedDate = new Date(submittedMs);
                        submittedTimeStr = submittedDate.toLocaleString('th-TH', {
                            day: 'numeric', month: 'short',
                            hour: '2-digit', minute: '2-digit',
                            timeZone: 'Asia/Bangkok'
                        });
                    }

                    const btnHTML = isDone
                        ? `<button class="btn-submit" style="background-color: var(--accent); color: white;" onclick="viewProof('${a.proofUrl || ''}', '${a.proofNote || ''}')">PROOF</button>`
                        : `<button class="btn-submit" onclick="goToSubmit('${task.taskId}', '${a.assignmentId}')">SUBMIT</button>`;

                    assigneesHTML += `
                        <div class="assignee-item">
                            <div class="assignee-info">
                                <div class="avatar">${initial}</div>
                                <div class="assignee-details">
                                    <div class="assignee-name">${displayName}</div>
                                    <div class="assignee-status ${isDone ? 'done' : ''}">
                                        ${isDone ? 'SUBMITTED' : 'PENDING'}
                                        ${submittedTimeStr ? `<span style="font-weight:400;color:#64748B;font-size:10px;"> · ${submittedTimeStr}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            ${btnHTML}
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge-active">${isCompleted ? 'COMPLETED' : 'ACTIVE'}</span>
                        <span class="task-id">#${task.taskId.substring(0, 4)}</span>
                    </div>
                    <h2 class="task-title">${task.taskName}</h2>
                    <p class="task-desc">${task.description || ''}</p>
                    
                    <div class="progress-section">
                        <div class="progress-header">
                            <span>COMPLETION</span>
                            <span>${progress}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <div class="card-divider"></div>
                    <div class="card-footer">
                        <div class="footer-item">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            ${totalCount} Assignees
                        </div>
                        <div class="footer-item">${dateStr}</div>
                    </div>

                    <!-- Expanded View -->
                    <div class="assignees-container">
                        <div class="assignees-title">ASSIGNEES</div>
                        ${assigneesHTML}
                    </div>
                    <div class="action-buttons">
                        ${!isCompleted ? `<button class="btn-action btn-edit" onclick="goToEdit('${task.taskId}')">Edit Task</button>` : ''}
                        ${isCompleted && task.proofUrl ? `<button class="btn-action" style="background-color: var(--accent); color: white;" onclick="viewProof('${task.proofUrl}', '${task.proofNote || ''}')">View Proof</button>` : ''}
                        <button class="btn-action btn-delete" onclick="deleteTask('${task.taskId}')">Delete</button>
                    </div>
                `;
                taskList.appendChild(card);
            });

            document.getElementById('tab-pending').innerText = `${pendingCount} PENDING`;
            document.getElementById('tab-completed').innerText = `${completedCount} COMPLETED`;
        }

        function viewProof(url, note) {
            if (!url) {
                alert('No proof uploaded.');
                return;
            }
            if (note) {
                alert('บันทึกเพิ่มเติม: ' + note);
            }
            window.open(url, '_blank');
        }

        function goToSubmit(taskId, assignmentId) {
            window.location.href = `/confirm.html?groupId=${currentGroupId}&taskId=${taskId}&assignmentId=${assignmentId}`;
        }

        function goToEdit(taskId) {
            window.location.href = `/create-task.html?groupId=${currentGroupId}&taskId=${taskId}&mode=edit`;
        }

        async function deleteTask(taskId) {
            if(confirm('Are you sure you want to delete this task?')) {
                try {
                    const res = await fetch(`/api/tasks/${currentGroupId}/${taskId}/delete`, {
                        method: 'POST'
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert('Task deleted successfully!');
                        loadTasks();
                    } else {
                        alert('Error: ' + (data.error || 'Failed to delete task'));
                    }
                } catch (err) {
                    console.error('Delete error', err);
                    alert('Error connecting to server for deletion.');
                }
            }
        }
    </script>
</body>
</html>
